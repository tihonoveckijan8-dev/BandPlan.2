name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # WHY: Flutter copies web/ assets as-is; raster icons are required for
      # reliable install surfaces across Chromium and iOS Safari.
      - name: Generate PWA PNG icons
        run: |
          mkdir -p web/icons
          convert web/icons/icon-192.svg -resize 192x192 web/icons/icon-192.png
          convert web/icons/icon-512.svg -resize 512x512 web/icons/icon-512.png
          convert web/icons/icon-192.svg -resize 180x180 web/icons/apple-touch-icon.png

      - name: Run unit and widget tests
        run: flutter test

      - name: Build web app
        run: |
          flutter build web --release \
            --base-href "/BandPlan.2/" \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

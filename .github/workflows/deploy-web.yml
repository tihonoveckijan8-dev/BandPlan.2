name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # WHY: Generate real PNG install icons without depending on optional
      # image utilities on the hosted runner.
      - name: Generate PWA PNG icons
        run: |
          mkdir -p web/icons
          python3 - <<'PY'
          import math
          import struct
          import zlib
          from pathlib import Path

          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body) & 0xffffffff)

          def make_icon(size, output):
              pixels = bytearray((16, 20, 38, 255) * size * size)

              def paint(x, y, color):
                  if 0 <= x < size and 0 <= y < size:
                      offset = (y * size + x) * 4
                      pixels[offset:offset + 4] = bytes((*color, 255))

              def rect(x0, y0, x1, y1, color, radius=0):
                  for y in range(max(0, y0), min(size, y1)):
                      for x in range(max(0, x0), min(size, x1)):
                          if radius:
                              cx = min(max(x, x0 + radius), x1 - radius - 1)
                              cy = min(max(y, y0 + radius), y1 - radius - 1)
                              if (x - cx) ** 2 + (y - cy) ** 2 > radius ** 2:
                                  continue
                          paint(x, y, color)

              blue = (21, 84, 255)
              white = (245, 247, 255)
              purple = (139, 92, 246)
              rect(round(size*.23), round(size*.22), round(size*.34), round(size*.79), blue, round(size*.035))

              glyph = (
                  "11110",
                  "10001",
                  "10001",
                  "11110",
                  "10001",
                  "10001",
                  "11110",
              )
              cell = round(size * .075)
              gx, gy = round(size * .40), round(size * .235)
              for row, line in enumerate(glyph):
                  for col, bit in enumerate(line):
                      if bit == "1":
                          rect(gx + col*cell, gy + row*cell, gx + (col+1)*cell, gy + (row+1)*cell, white, max(1, cell//7))

              cx, cy, radius = round(size*.77), round(size*.25), round(size*.055)
              for y in range(cy-radius, cy+radius+1):
                  for x in range(cx-radius, cx+radius+1):
                      if (x-cx)**2 + (y-cy)**2 <= radius**2:
                          paint(x, y, purple)

              raw = b"".join(b"\x00" + pixels[y*size*4:(y+1)*size*4] for y in range(size))
              header = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", header) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              Path(output).write_bytes(png)

          make_icon(192, "web/icons/icon-192.png")
          make_icon(512, "web/icons/icon-512.png")
          make_icon(180, "web/icons/apple-touch-icon.png")
          PY

      - name: Run unit and widget tests
        run: flutter test

      - name: Build web app
        run: |
          flutter build web --release \
            --base-href "/BandPlan.2/" \
            --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      # WHY: Flutter 3.47 no longer provides the old managed PWA cache.
      # Build a same-origin asset list so our own worker can cache only the app shell.
      - name: Prepare offline PWA cache
        env:
          PWA_BUILD_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/web")
          required = [
              "index.html",
              "flutter_bootstrap.js",
              "manifest.json",
              "service-worker.js",
              "icons/icon-192.png",
              "icons/icon-512.png",
              "icons/apple-touch-icon.png",
          ]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing PWA build files: " + ", ".join(missing))

          assets = sorted(
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
              and path.name not in {"asset-manifest.json", "service-worker.js"}
              and path.suffix != ".map"
          )
          if not assets:
              raise SystemExit("PWA asset list is empty")

          build_id = os.environ["PWA_BUILD_ID"]
          (root / "asset-manifest.json").write_text(
              json.dumps({"buildId": build_id, "assets": assets}, ensure_ascii=False),
              encoding="utf-8",
          )
          worker_path = root / "service-worker.js"
          worker = worker_path.read_text(encoding="utf-8")
          if "__BUILD_ID__" not in worker:
              raise SystemExit("Service worker build ID placeholder is missing")
          worker_path.write_text(worker.replace("__BUILD_ID__", build_id), encoding="utf-8")
          print(f"Prepared offline cache for {len(assets)} same-origin files (build {build_id})")
          PY
          node --check build/web/service-worker.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Android APK

on:
  pull_request:
    paths:
      - "**.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BandPlan Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android platform scaffolding
        run: |
          flutter create \
            --platforms=android \
            --org com.bandplan \
            --project-name bandplan \
            /tmp/bandplan_android
          cp -R /tmp/bandplan_android/android ./android
          # WHY: Android requires an explicit runtime microphone permission for the guitar tuner.
          sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          # WHY: record requires Android API 23 or newer.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts

      # WHY: Reuse one private upload key across builds so Android accepts APK updates
      # over the installed app instead of requiring users to uninstall it first.
      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::notice::Persistent signing is not configured. This APK is for initial testing; configure the four ANDROID_* GitHub Actions secrets to enable update-safe signing."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          export ANDROID_KEYSTORE_PATH="upload-keystore.jks"

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          if "signingConfigs {" not in source:
              source = source.replace(
                  "android {",
                  """android {
              signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """,
                  1,
              )

          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          source, count = re.subn(
              pattern,
              r'\1\n            signingConfig = signingConfigs.getByName("release")',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate the generated release buildType in build.gradle.kts")
          gradle.write_text(source)
          PY

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BandPlan-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandPlan-Android-APK
          path: dist/BandPlan-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: BandPlan Android — latest
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/BandPlan-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

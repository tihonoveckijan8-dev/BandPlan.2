name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BandPlan Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Generate Android platform scaffolding
        run: |
          flutter create \
            --platforms=android \
            --org com.bandplan \
            --project-name bandplan \
            /tmp/bandplan_android
          cp -R /tmp/bandplan_android/android ./android

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/BandPlan-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandPlan-Android-APK
          path: dist/BandPlan-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: BandPlan Android — latest
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/BandPlan-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BandPlan — Music Group OS">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101426">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BandPlan">
  <title>BandPlan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #101426;
    }
    #bandplan-startup {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-content: center;
      gap: 16px;
      padding: 28px;
      box-sizing: border-box;
      background: #101426;
      color: #e8ecf8;
      font: 600 16px/1.5 Manrope, system-ui, sans-serif;
      text-align: center;
    }
    #bandplan-startup[hidden] { display: none; }
    #bandplan-startup .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto;
      border: 3px solid #ffffff30;
      border-top-color: #1554ff;
      border-radius: 50%;
      animation: bandplan-spin .8s linear infinite;
    }
    #bandplan-startup .details {
      max-width: 420px;
      color: #b6bed2;
      font-size: 13px;
      font-weight: 400;
    }
    #bandplan-startup button {
      min-height: 46px;
      margin: 4px auto 0;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: #1554ff;
      color: white;
      font: inherit;
    }
    #bandplan-update {
      position: fixed;
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 99998;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 14px 12px 18px;
      border-radius: 18px;
      background: #202b49;
      color: #f4f6ff;
      box-shadow: 7px 7px 18px #080d1b80, -5px -5px 14px #34436580;
      font: 600 13px/1.4 Manrope, system-ui, sans-serif;
    }
    #bandplan-update[hidden] { display: none; }
    #bandplan-update button {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: #1554ff;
      color: white;
      font: inherit;
    }
    #bandplan-update button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }
    @keyframes bandplan-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #bandplan-startup .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="bandplan-startup" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div id="bandplan-startup-title">Запускаем BandPlan…</div>
    <div id="bandplan-startup-details" class="details">Подготавливаем приложение.</div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px">
      <button id="bandplan-startup-retry" type="button" hidden>Перезагрузить</button>
      <button id="bandplan-startup-recover" type="button" hidden style="background:#303b59">Восстановить загрузку</button>
    </div>
  </div>
  <script>
    (function () {
      const panel = document.getElementById('bandplan-startup');
      const title = document.getElementById('bandplan-startup-title');
      const details = document.getElementById('bandplan-startup-details');
      const retry = document.getElementById('bandplan-startup-retry');
      const recover = document.getElementById('bandplan-startup-recover');
      let firstFrame = false;

      function showStartupError(message) {
        if (firstFrame) return;
        title.textContent = 'Не удалось запустить BandPlan';
        details.textContent = message || 'Проверьте подключение и попробуйте перезагрузить приложение.';
        retry.hidden = false;
        recover.hidden = false;
      }

      retry.addEventListener('click', function () {
        window.location.reload();
      });

      // WHY: A stale PWA shell can prevent Flutter from starting; remove only
      // BandPlan's Cache Storage and worker, never IndexedDB or localStorage.
      recover.addEventListener('click', async function () {
        recover.disabled = true;
        recover.textContent = 'Восстанавливаем…';
        details.textContent = 'Обновляем файлы приложения. Песни, профиль и локальные изменения не удаляются.';
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations
              .filter(function (registration) {
                return registration.scope === new URL('./', window.location.href).href;
              })
              .map(function (registration) { return registration.unregister(); }));
          }
          if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names
              .filter(function (name) { return name.indexOf('bandplan-pwa-shell-') === 0; })
              .map(function (name) { return caches.delete(name); }));
          }
          const cleanUrl = window.location.pathname + '?bp-recover=' +
            Date.now() + window.location.hash;
          window.location.replace(cleanUrl);
        } catch (error) {
          console.error('BandPlan cache recovery failed:', error);
          recover.disabled = false;
          recover.textContent = 'Повторить восстановление';
          details.textContent = 'Не удалось обновить кэш автоматически. Можно попробовать ещё раз.';
        }
      });

      // WHY: A failed Flutter bootstrap must show a recoverable message instead of a blank white page.
      window.addEventListener('error', function (event) {
        showStartupError(event.message || 'Ошибка загрузки приложения.');
      });
      window.addEventListener('unhandledrejection', function () {
        showStartupError('Ошибка инициализации приложения. Попробуйте перезагрузить страницу.');
      });

      // WHY: Hide the HTML fallback only after Flutter has actually painted its first frame.
      window.addEventListener('flutter-first-frame', function () {
        firstFrame = true;
        panel.hidden = true;
      }, { once: true });

      // WHY: Catch stalled downloads or a stale PWA shell even when no JS exception is emitted.
      window.setTimeout(function () {
        if (!firstFrame) {
          showStartupError('Загрузка заняла слишком много времени. Перезагрузите приложение.');
        }
      }, 20000);

      // WHY: Check for a newer worker on every fresh entry, without forcing a reload during an active session.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js', {
          scope: './',
          updateViaCache: 'none'
        }).then(function (registration) {
          registration.update().catch(function (error) {
            console.warn('BandPlan PWA update check failed:', error);
          });
        }).catch(function (error) {
          console.error('BandPlan PWA worker registration failed:', error);
        });
      }
    })();
  </script>
  <aside id="bandplan-update" role="status" aria-live="polite" hidden>
    <span>Доступна новая версия BandPlan</span>
    <button id="bandplan-update-apply" type="button">Обновить</button>
  </aside>
  <script>
    // WHY: Keep updates visible while the app is open, but let the user choose
    // when to activate the waiting worker so an active session is never interrupted.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      const banner = document.getElementById('bandplan-update');
      const apply = document.getElementById('bandplan-update-apply');
      let updateRequested = false;
      let reloadOnControllerChange = false;

      function showUpdate(registration) {
        if (registration.waiting && navigator.serviceWorker.controller) {
          banner.hidden = false;
        }
      }

      function watchInstallingWorker(registration) {
        const installing = registration.installing;
        if (!installing) {
          showUpdate(registration);
          return;
        }
        const checkInstalled = function () {
          if (installing.state === 'installed') showUpdate(registration);
        };
        // WHY: The registration/update check can start before this watcher is
        // attached. Check the current state immediately as well as future events,
        // otherwise an already-installed waiting worker can be missed.
        installing.addEventListener('statechange', checkInstalled);
        checkInstalled();
      }

      navigator.serviceWorker.getRegistration('./').then(function (registration) {
        if (!registration) return;
        showUpdate(registration);
        // WHY: The first script may have started downloading an update before
        // this listener was attached; watch an already-installing worker too.
        watchInstallingWorker(registration);
        registration.addEventListener('updatefound', function () {
          watchInstallingWorker(registration);
        });

        // WHY: Check for updates on fresh app entry only. Do not poll or
        // interrupt a rehearsal/session while the user is working in BandPlan.
      }).catch(function (error) {
        console.warn('BandPlan PWA update watcher failed:', error);
      });

      apply.addEventListener('click', function () {
        navigator.serviceWorker.getRegistration('./').then(function (registration) {
          if (!registration || !registration.waiting || updateRequested) return;
          updateRequested = true;
          reloadOnControllerChange = true;
          apply.disabled = true;
          apply.textContent = 'Обновляем…';
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (reloadOnControllerChange) window.location.reload();
          }, { once: true });
          registration.waiting.postMessage({ type: 'BANDPLAN_SKIP_WAITING' });
        }).catch(function (error) {
          updateRequested = false;
          reloadOnControllerChange = false;
          apply.disabled = false;
          apply.textContent = 'Повторить';
          console.error('BandPlan PWA update activation failed:', error);
        });
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
